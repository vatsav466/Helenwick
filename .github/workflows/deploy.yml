name: Build and Deploy NOVEX

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

# ─────────────────────────────────────────────────────────────────────────────
# Job 1 — Build Docker image and push to GitHub Container Registry
# ─────────────────────────────────────────────────────────────────────────────
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GH_PAT }}

      # Docker image names must be all lowercase — GitHub repo names can have
      # capital letters, so normalise once and reuse below.
      - name: Set lowercase image name
        run: echo "IMAGE_NAME_LOWER=$(echo '${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Extract Docker metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWER }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

# ─────────────────────────────────────────────────────────────────────────────
# Job 2 — SSH into the server and deploy the new image
# Runs only on pushes to main (not on PRs).
# ─────────────────────────────────────────────────────────────────────────────
  deploy:
    needs: build-and-push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      # Repeat lowercasing here — env vars set via GITHUB_ENV in job 1
      # do not carry over to job 2, they're separate runners.
      - name: Set lowercase image name
        run: echo "IMAGE_NAME_LOWER=$(echo '${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Verify required secrets are set
        run: |
          missing=0
          [ -z "${{ secrets.SERVER_HOST }}" ] && echo "::error::SERVER_HOST secret is missing or empty" && missing=1
          [ -z "${{ secrets.SERVER_USER }}" ] && echo "::error::SERVER_USER secret is missing or empty" && missing=1
          [ -z "${{ secrets.SERVER_PASS }}" ] && echo "::error::SERVER_PASS secret is missing or empty" && missing=1
          [ -z "${{ secrets.GH_PAT }}" ] && echo "::error::GH_PAT secret is missing or empty" && missing=1
          if [ "$missing" -eq 1 ]; then
            echo "Add the missing secret(s) under Settings > Secrets and variables > Actions > Secrets tab."
            echo "If they already exist there but this still fails, they may be under Settings > Environments instead — add 'environment: <name>' to this job."
            exit 1
          fi
          echo "All required secrets are present."

      - name: Deploy to server via SSH
        env:
          # Forwarded into the remote script's environment via `envs:` below.
          # Without this, $SERVER_PASS is empty on the remote side and every
          # sudo -S call gets a blank password.
          SERVER_PASS: ${{ secrets.SERVER_PASS }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASS }}
          port: 22
          envs: SERVER_PASS
          script: |
            set -e

            # PREFERRED FIX (do this once, then every "run_sudo" below can
            # just become "sudo"): ssh in and run
            #   sudo usermod -aG docker $USER
            # then log out/in so group membership takes effect. Until then,
            # this helper re-authenticates sudo on EVERY call instead of
            # relying on sudo's cached timestamp — that cache can expire
            # (often under 5 min) while `docker pull` is still downloading
            # layers, leaving later commands (like image prune) with no
            # valid credential and no TTY to prompt for one.
            run_sudo() {
              echo "$SERVER_PASS" | sudo -S "$@"
            }
            run_sudo -v

            # ── Normalise image name (GHCR requires lowercase) ──────────────
            IMAGE=$(echo "ghcr.io/${{ github.repository }}" | tr '[:upper:]' '[:lower:]')

            # ── Authenticate and pull latest image ──────────────────────────
            if ! echo "${{ secrets.GH_PAT }}" | run_sudo docker login ghcr.io \
              -u "${{ github.actor }}" \
              --password-stdin; then
              echo "❌ GHCR login failed (denied: denied)."
              echo "   This means the GH_PAT secret is missing, expired, or lacks"
              echo "   read:packages/write:packages scope — NOT an nginx or app issue."
              echo "   Fix: regenerate a classic PAT with write:packages + read:packages"
              echo "   scopes, update the GH_PAT secret, and re-run this workflow."
              exit 1
            fi

            run_sudo docker pull ${IMAGE}:latest

            # ── Stop and remove the old container (ignore errors if absent) ─
            run_sudo docker stop novex-app || true
            run_sudo docker rm   novex-app || true

            # ── Create required host directories ────────────────────────────
            run_sudo mkdir -p /opt/digitaltwin_images

            # ── Launch container ─────────────────────────────────────────────
            # --network host is REQUIRED: the .alg_env connection strings use
            # "localhost" to reach PostgreSQL, Redis, and other services that
            # run directly on this server. With host networking the container
            # shares the host network stack, so "localhost" inside the
            # container == the server's localhost. Ports 5378 (nginx) and
            # 8002 (FastAPI) are bound on the host directly — no -p mappings
            # needed or allowed in host mode.
            run_sudo docker run -d \
              --name novex-app \
              --restart unless-stopped \
              --network host \
              -v /opt/digitaltwin_images:/opt/digitaltwin_images \
              ${IMAGE}:latest

            # ── Wait for nginx / frontend to become healthy (up to 90 s) ────
            echo "Waiting for application to start..."
            for i in $(seq 1 18); do
              STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5378/ || echo "000")
              if [ "$STATUS" = "200" ]; then
                echo "✅ Frontend is up (HTTP $STATUS)"
                break
              fi
              echo "   Not ready yet (HTTP $STATUS) — attempt $i/18..."
              sleep 5
              if [ "$i" -eq 18 ]; then
                echo "❌ Frontend did not start within 90 s."
                echo "--- nginx config inside container ---"
                run_sudo docker exec novex-app nginx -t || true
                echo "--- API process logs ---"
                run_sudo docker exec novex-app cat /var/log/api.log 2>/dev/null | tail -50 || true
                echo "--- Full container logs ---"
                run_sudo docker logs --tail 100 novex-app
                exit 1
              fi
            done

            # ── Verify /docs on port 5378 (via nginx proxy) ─────────────────
            DOCS_5378=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5378/docs || echo "000")
            echo "http://localhost:5378/docs  → HTTP ${DOCS_5378}"
            if [ "${DOCS_5378}" = "000" ]; then
              echo "❌ /docs unreachable on port 5378"
              run_sudo docker logs --tail 50 novex-app
              exit 1
            fi

            # ── Verify /docs on port 8002 (FastAPI direct) ──────────────────
            DOCS_8002=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8002/docs || echo "000")
            echo "http://localhost:8002/docs  → HTTP ${DOCS_8002}"
            if [ "${DOCS_8002}" = "000" ]; then
              echo "❌ FastAPI not reachable on port 8002"
              run_sudo docker exec novex-app cat /var/log/api.log 2>/dev/null | tail -50 || true
              run_sudo docker logs --tail 50 novex-app
              exit 1
            fi

            echo ""
            echo "════════════════════════════════════════════════════"
            echo "✅  Deploy complete"
            echo "   Dashboard : http://${{ secrets.SERVER_HOST }}:5378/"
            echo "   Swagger   : http://${{ secrets.SERVER_HOST }}:5378/docs"
            echo "   FastAPI   : http://${{ secrets.SERVER_HOST }}:8002/docs"
            echo "════════════════════════════════════════════════════"

            # ── Prune dangling images to reclaim disk space ──────────────────
            run_sudo docker image prune -f
