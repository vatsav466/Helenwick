##############################################################################
# NOVEX CI/CD Pipeline
#
# Triggers: push to main, or manual dispatch
#
# Steps:
#   1. Build the Docker image (multi-stage: React + Python/nginx)
#   2. Push to GitHub Container Registry (ghcr.io)
#   3. SSH into server, pull the new image, redeploy with rollback
#   4. Health-check the live service (up to 150 s window)
#   5. Auto-rollback to previous container on failure
##############################################################################

name: "Build & Deploy NOVEX"

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/novex
  CONTAINER_NAME: novex_app

jobs:
  build-and-deploy:
    name: "Build → Push → Deploy"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: "📥 Checkout source"
        uses: actions/checkout@v4

      # ── 2. Docker Buildx ─────────────────────────────────────────────────────
      - name: "🔧 Set up Docker Buildx"
        uses: docker/setup-buildx-action@v3

      # ── 3. Login to GHCR ─────────────────────────────────────────────────────
      - name: "🔐 Login to GitHub Container Registry"
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GH_PAT }}

      # ── 4. Extract metadata (tags + labels) ──────────────────────────────────
      - name: "🏷️  Docker metadata"
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      # ── 5. Build & push ───────────────────────────────────────────────────────
      - name: "🏗️  Build & push Docker image"
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── 6. Deploy to server ───────────────────────────────────────────────────
      - name: "🚀 Deploy to production server"
        uses: appleboy/ssh-action@v1.0.3
        env:
          IMAGE_TAG: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          GH_PAT: ${{ secrets.GH_PAT }}
          GH_ACTOR: ${{ github.actor }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASS }}
          envs: IMAGE_TAG,GH_PAT,GH_ACTOR
          timeout: 180s
          script: |
            set -e

            echo "════════════════════════════════════════════════"
            echo "  STEP 1/6 — Login to GHCR"
            echo "════════════════════════════════════════════════"
            echo "$GH_PAT" | sudo docker login ghcr.io -u "$GH_ACTOR" --password-stdin

            echo "════════════════════════════════════════════════"
            echo "  STEP 2/6 — Pull new image"
            echo "════════════════════════════════════════════════"
            sudo docker pull "$IMAGE_TAG"

            echo "════════════════════════════════════════════════"
            echo "  STEP 3/6 — Rename current container (rollback anchor)"
            echo "════════════════════════════════════════════════"
            if sudo docker ps -a --format '{{.Names}}' | grep -q "^novex_app$"; then
              sudo docker rename novex_app novex_app_rollback || true
              sudo docker stop novex_app_rollback 2>/dev/null || true
              echo "Previous container renamed to novex_app_rollback"
            else
              echo "No existing container found — fresh deploy"
            fi

            echo "════════════════════════════════════════════════"
            echo "  STEP 4/6 — Start new container"
            echo "════════════════════════════════════════════════"
            sudo docker run -d \
              --name novex_app \
              --network host \
              --restart unless-stopped \
              -e MODE=prod \
              "$IMAGE_TAG"

            echo "════════════════════════════════════════════════"
            echo "  STEP 5/6 — Health check (30 probes × 5 s = 150 s)"
            echo "════════════════════════════════════════════════"
            SUCCESS=0
            for i in $(seq 1 30); do
              HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
                --max-time 5 http://localhost:5378/health 2>/dev/null || true)
              if [ "$HTTP_CODE" = "200" ]; then
                echo "  ✅ Probe $i — HTTP 200 — Service is up!"
                SUCCESS=1
                break
              fi
              echo "  ⏳ Probe $i — HTTP ${HTTP_CODE:-timeout} — Waiting…"
              sleep 5
            done

            echo "════════════════════════════════════════════════"
            echo "  STEP 6/6 — Finalise"
            echo "════════════════════════════════════════════════"
            if [ "$SUCCESS" = "1" ]; then
              echo "✅ Deploy succeeded — removing rollback anchor"
              sudo docker rm -f novex_app_rollback 2>/dev/null || true
              # Clean up old dangling images to save disk space
              sudo docker image prune -f 2>/dev/null || true
              echo "🎉 NOVEX is live at http://165.101.248.89:5378/"
            else
              echo "❌ Health check failed — rolling back!"
              sudo docker rm -f novex_app 2>/dev/null || true
              if sudo docker ps -a --format '{{.Names}}' | grep -q "^novex_app_rollback$"; then
                sudo docker rename novex_app_rollback novex_app
                sudo docker start novex_app
                echo "⚠️  Rolled back to previous container"
              else
                echo "⚠️  No rollback container available"
              fi
              exit 1
            fi
