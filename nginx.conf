##############################################################################
# nginx — NOVEX frontend + API reverse proxy
# Listens on :5378
# Serves React SPA static files from /usr/share/nginx/html
# Proxies all /api/* requests to the FastAPI backend on localhost:8002
##############################################################################

server {
    listen 5378;
    server_name 165.101.248.89 _;

    # ── Gzip compression ────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/javascript application/x-javascript application/xml
        application/json application/rss+xml application/atom+xml
        image/svg+xml;

    # ── Security headers ────────────────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── Static assets — long cache ──────────────────────────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|eot|map)$ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── FastAPI docs (proxy to backend) ─────────────────────────────────────
    location ~ ^/(docs|redoc|openapi\.json)$ {
        proxy_pass         http://127.0.0.1:8002;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 15s;
    }

    # ── Backend API (proxy to FastAPI on port 8002) ──────────────────────────
    location /api/ {
        proxy_pass         http://127.0.0.1:8002;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        # Support streaming responses (Server-Sent Events, large downloads)
        proxy_buffering    off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 15s;
        # Forward cookies unchanged so session cookies work correctly
        proxy_pass_header  Set-Cookie;
        proxy_cookie_path  / /;
    }

    # ── React SPA — serve index.html for all non-file routes ────────────────
    location / {
        root  /usr/share/nginx/html;
        index index.html;
        # Cache control: don't cache index.html so new deployments are picked up
        location = /index.html {
            add_header Cache-Control "no-store, no-cache, must-revalidate";
        }
        try_files $uri $uri/ /index.html;
    }

    # ── Health probe (used by GitHub Actions + Docker healthcheck) ───────────
    location = /health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }

    # ── Error pages ──────────────────────────────────────────────────────────
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}
