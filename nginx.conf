# =====================================================================
# nginx.conf  ->  save at REPO ROOT (next to the root Dockerfile)
# =====================================================================
# NOTE: this is for the SINGLE combined image (root Dockerfile +
# supervisord running nginx + backend together in one container).
# Here 127.0.0.1 is correct, because nginx and the backend process are
# both inside the same container.
#
# PORT MAPPING (matches supervisord.conf):
#   8002 -> urdhva_api   (main FastAPI backend — all /api/* routes,
#                         /docs, /redoc, /openapi.json)
#   8003 -> cache_api    (cache gateway — /api_cache/* routes only)

server {
    listen 5378;
    server_name localhost;

    client_max_body_size 100M;

    root /usr/share/nginx/html;
    index index.html;

    # Serve the built React (Vite) app; fall back to index.html for
    # client-side routing.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Digital twin model assets
    location /digitaltwin-images/ {
        alias /opt/digitaltwin_images/;

        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods "GET, OPTIONS";
        add_header Access-Control-Allow-Headers "*";

        types {
            model/gltf-binary glb;
        }
    }

    # ── Main FastAPI backend (port 8002) ──────────────────────────────
    # All business API routes: /api/users/login, /api/alerts/*, etc.
    location /api/ {
        proxy_pass http://127.0.0.1:8002/api/;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_cache_bypass $http_upgrade;

        proxy_buffers 8 1024k;
        proxy_buffer_size 1024k;
    }

    # FastAPI interactive docs — served by urdhva_api on port 8002
    location /docs {
        proxy_pass http://127.0.0.1:8002/docs;
        proxy_set_header Host $host;
    }

    location /redoc {
        proxy_pass http://127.0.0.1:8002/redoc;
        proxy_set_header Host $host;
    }

    location /openapi.json {
        proxy_pass http://127.0.0.1:8002/openapi.json;
        proxy_set_header Host $host;
    }

    # ── Cache gateway (port 8003) ─────────────────────────────────────
    # Narrow service: only /api_cache/* routes live here.
    location /api_cache/ {
        proxy_pass http://127.0.0.1:8003/api_cache/;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    error_page 502 /custom_502.html;
    location = /custom_502.html {
        root /usr/share/nginx/html;
        internal;
    }
}
