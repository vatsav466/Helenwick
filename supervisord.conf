; ──────────────────────────────────────────────────────────────────────────────
; supervisord.conf — manages all processes inside the NOVEX Docker container
;
; Processes:
;   redis      — Redis in-process cache / session store
;   api        — FastAPI (uvicorn) on port 8002
;   nginx      — reverse proxy + static file server on port 5378
; ──────────────────────────────────────────────────────────────────────────────

[supervisord]
nodaemon=true
logfile=/var/log/supervisord.log
logfile_maxbytes=10MB
logfile_backups=3
loglevel=info
pidfile=/tmp/supervisord.pid
user=root

[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

; ── Redis ──────────────────────────────────────────────────────────────────────
[program:redis]
command=redis-server --save "" --appendonly no --maxmemory 256mb --maxmemory-policy allkeys-lru
autostart=true
autorestart=true
startsecs=3
priority=10
stdout_logfile=/var/log/redis.log
stderr_logfile=/var/log/redis.log
stdout_logfile_maxbytes=5MB
stopasgroup=true
killasgroup=true

; ── FastAPI backend (uvicorn, single worker) ───────────────────────────────────
[program:api]
command=/opt/venv/bin/python -m urdhva_base
directory=/opt/ceg/algo/api_manager
environment=PORT="8002",MODE="prod"
autostart=true
autorestart=true
startsecs=10
startretries=5
priority=20
stdout_logfile=/var/log/api.log
stderr_logfile=/var/log/api.log
stdout_logfile_maxbytes=10MB
stopasgroup=true
killasgroup=true

; ── nginx ─────────────────────────────────────────────────────────────────────
[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
startsecs=5
priority=30
stdout_logfile=/var/log/nginx_access.log
stderr_logfile=/var/log/nginx_error.log
stdout_logfile_maxbytes=10MB
stopasgroup=true
killasgroup=true
